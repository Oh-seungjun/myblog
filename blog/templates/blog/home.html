<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>My Blog</h1>

    <a href="{% url 'post_create' %}">글 작성</a>

    {% for post in posts %}
        <article>
            <h2>
                <a href="{% url 'post_detail' post.id %}">
                    {{ post.title }}
                </a>
            </h2>
            <p>{{ post.content }}</p>
            <small>{{ post.created_at }}</small>
        </article>
    {% endfor %}

</body>
</html>
