<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>My Blog</h1>

    {% for post in posts %}
        <article>
            <h2>
                <a href="/post/{{ post.id }}/">
                    {{ post.title }}
                </a>
            </h2>
            <p>{{ post.content }}</p>
            <small>{{ post.created_at }}</small>
        </article>
    {% endfor %}

</body>
</html>
